[package]
name = "cinder-web-channel-qualification"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Isolated qualification only: not linked into the shipping enclave/financial API.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
zeroize = "=1.8.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[profile.release]
overflow-checks = true
