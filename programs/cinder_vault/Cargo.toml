[package]
name = "cinder-vault"
version = "0.1.0"
description = "Cinder L1 vault: Config, ReserveRoot, USDC ATA, halt"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cinder_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"
cinder-common = { path = "../../crates/cinder-common" }
