[package]
name = "cinder-vault"
version = "0.1.0"
description = "Cinder L1 vault: Config, ReserveRoot, USDC ATA, halt"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cinder_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = "=1.0.2"
cinder-common = { path = "../../crates/cinder-common" }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor"] }
phoenix-rise-accounts = "=0.5.6"
phoenix-rise-ix = "=0.5.6"
solana-pubkey = "=3.0.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
solana-instructions-sysvar = "=3.0.1"
