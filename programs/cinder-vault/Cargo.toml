[package]
name = "cinder-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "cinder_vault"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
# Anchor's generated token-init code references this module even for classic Token.
# Typed Program<Token>/Account<Mint> still reject Token-2022 at instruction boundaries.
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
