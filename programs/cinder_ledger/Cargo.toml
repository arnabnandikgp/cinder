[package]
name = "cinder-ledger"
version = "0.1.0"
description = "Cinder ER ledger: UserLedger, Book, FeeAccrual, order machine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cinder_ledger"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
cinder-common = { path = "../../crates/cinder-common" }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "access-control"] }
