# Rust units always. Local validator checks ledger and collateral behavior.
# The privacy stack checks QFS access control and two-user netting in separate
# environments. The fork job covers Phoenix venue and funding integration.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NO_DNA: "1"
  CINDER_REQUIRE_STACK: "1"

jobs:
  operator-unit:
    name: protocol unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: cinder-ci
          cache-targets: true
      - name: Operator recovery and protocol core tests
        run: cargo test --locked --workspace

  onchain:
    name: on-chain programs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana-anchor
      - name: Ledger and withdrawal tests (legacy validator)
        run: anchor test --validator legacy
      - name: Collateral tests (no Phoenix)
        run: CINDER_MOCHA=collateral.test.ts anchor test --validator legacy --skip-build

  privacy:
    name: QFS privacy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana-anchor
      - uses: ./.github/actions/start-privacy-stack
      - name: Deploy and verify QFS isolation
        env:
          PROVIDER_ENDPOINT: http://127.0.0.1:8899
          WS_ENDPOINT: ws://127.0.0.1:8900
          EPHEMERAL_PROVIDER_ENDPOINT: http://127.0.0.1:7799
          EPHEMERAL_WS_ENDPOINT: ws://127.0.0.1:7800
          TEE_PROVIDER_ENDPOINT: http://127.0.0.1:6699
          TEE_WS_ENDPOINT: ws://127.0.0.1:6700
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          VALIDATOR: mAGicPQYBMvcYveUZA5F5UNNwyHvfYh5xkLS2Fr1mev
        run: |
          anchor build
          anchor deploy --provider.cluster localnet
          cargo build --locked -p cinder-operator --bin cinder-operator --example recovery-fixture
          yarn run ts-mocha -p ./tsconfig.json -t 120000 tests/privacy.test.ts
      - name: Privacy stack log on failure
        if: failure()
        run: tail -n 200 mb-stack.log || true

  netting-privacy:
    name: netting and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana-anchor
      - uses: ./.github/actions/start-privacy-stack
      - name: Deploy and verify two-user netting
        env:
          PROVIDER_ENDPOINT: http://127.0.0.1:8899
          WS_ENDPOINT: ws://127.0.0.1:8900
          EPHEMERAL_PROVIDER_ENDPOINT: http://127.0.0.1:7799
          EPHEMERAL_WS_ENDPOINT: ws://127.0.0.1:7800
          TEE_PROVIDER_ENDPOINT: http://127.0.0.1:6699
          TEE_WS_ENDPOINT: ws://127.0.0.1:6700
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          VALIDATOR: mAGicPQYBMvcYveUZA5F5UNNwyHvfYh5xkLS2Fr1mev
        run: |
          anchor build
          anchor deploy --provider.cluster localnet
          yarn run ts-mocha -p ./tsconfig.json -t 180000 tests/netting.test.ts
      - name: Privacy stack log on failure
        if: failure()
        run: tail -n 200 mb-stack.log || true

  phoenix-integration:
    name: Phoenix integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana-anchor
      - uses: actions/cache@v4
        id: cache-surfpool
        with:
          path: ~/.local/bin/surfpool
          key: surfpool-1.5.0-${{ runner.os }}-x64
      - name: Install Surfpool 1.5.0
        if: steps.cache-surfpool.outputs.cache-hit != 'true'
        run: |
          tar="surfpool-linux-x64.tar.gz"
          sha="5b20a3b46e60c4f819af7b4da5c3ea211f76041710617841cc23247d15887ddc"
          url="https://github.com/solana-foundation/surfpool/releases/download/v1.5.0/${tar}"
          curl -fsSL -o "/tmp/${tar}" "$url"
          echo "${sha}  /tmp/${tar}" | sha256sum -c -
          tar -xzf "/tmp/${tar}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/surfpool "$HOME/.local/bin/surfpool"
      - name: Surfpool PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start Surfpool mainnet fork
        env:
          SURFPOOL_RPC_URL: ${{ secrets.SURFPOOL_RPC_URL }}
        run: |
          if [ -z "${SURFPOOL_RPC_URL}" ]; then
            echo "SURFPOOL_RPC_URL repository secret is required" >&2
            exit 1
          fi
          surfpool start \
            --rpc-url "${SURFPOOL_RPC_URL}" \
            --skip-signature-verification \
            --ci \
            --no-deploy \
            > surfpool.log 2>&1 &
          echo $! > surfpool.pid
          ./scripts/wait-rpc.sh http://127.0.0.1:8899 300
      - name: Phoenix venue boot
        env:
          CINDER_VENUE: "1"
          PROVIDER_ENDPOINT: http://127.0.0.1:8899
        run: yarn run ts-mocha -p ./tsconfig.json -t 180000 tests/venue.test.ts
      - name: Funding Rise smoke
        env:
          CINDER_FUNDING: "1"
          PROVIDER_ENDPOINT: http://127.0.0.1:8899
        run: yarn run ts-mocha -p ./tsconfig.json -t 180000 tests/funding-fork.test.ts
      - uses: ./.github/actions/start-privacy-stack
        with:
          start: "false"
      - name: Bounded execution, autonomous maintenance and private crash recovery
        env:
          CINDER_R5_FORK: "1"
          CINDER_R6_MAINTENANCE: "1"
          SURFPOOL_RPC_URL: ${{ secrets.SURFPOOL_RPC_URL }}
        run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576 || true
          ulimit -n 1048576 || ulimit -n 65536 || true
          bash scripts/test-runtime-fork.sh
          CINDER_R5_PRIVATE=0 CINDER_R5_SKIP_PROGRAM_BUILD=1 bash scripts/test-runtime-fork.sh
      - name: Surfpool log on failure
        if: failure()
        run: tail -n 200 surfpool.log || true
