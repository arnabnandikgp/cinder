name: Offline ARM64 runtime package

on:
  pull_request:
    branches: [product/tee-v1, "tee/**"]
  push:
    branches: [product/tee-v1]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  default-package:
    name: Offline ARM64 default-feature package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Cache locked dependencies and isolated ARM64 intermediates
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: arm64-package-${{ hashFiles('tools/nitro-linux/Containerfile', 'tools/nitro-linux/cargo-config.toml', 'tools/nitro-runtime/package-check.sh') }}
          cache-bin: false
          cache-workspace-crates: false
          workspaces: . -> target/arm64-package
      - name: Prepare the locked public dependencies and source export
        run: |
          set -euo pipefail
          cargo +1.97.1 fetch --locked
          cargo +1.97.1 vendor --locked --offline --versioned-dirs "$RUNNER_TEMP/cinder-vendor" > "$RUNNER_TEMP/cinder-vendor-config.toml"
          mkdir "$RUNNER_TEMP/cinder-source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/cinder-source"
          mkdir -p target/arm64-package
      - name: Prepare the ARM64 tool-only image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare the pinned ARM64 Linux toolchain (no application source)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: tools/nitro-linux
          file: tools/nitro-linux/Containerfile
          platforms: linux/arm64
          load: true
          tags: cinder-ci-arm64:check
          cache-from: type=gha,scope=cinder-arm64-tools
          cache-to: type=gha,scope=cinder-arm64-tools,mode=max,ignore-error=true
      - name: Default-feature release, reproducibility and non-Nitro refusal
        run: |
          docker run --rm --network none --platform linux/arm64 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$RUNNER_TEMP/cinder-source,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/cinder-vendor,target=/vendor,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/target/arm64-package,target=/build-cache" \
            --workdir /source -e CARGO_HOME=/tmp/cargo -e CARGO_BUILD_JOBS=4 \
            cinder-ci-arm64:check sh tools/nitro-runtime/package-check.sh
