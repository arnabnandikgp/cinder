name: TEE workspace

on:
  pull_request:
    branches: [product/tee-v1, "tee/**"]
  push:
    branches: [product/tee-v1]

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-workspace:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lint
            name: Offline Rust lint and build
          - group: rust
            name: Offline Rust regressions
          - group: client
            name: Offline SDK and relay regressions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned build tools
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Install TLS build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Fetch locked storage dependencies
        run: cargo fetch --locked
      - name: Install locked private-client check tools
        if: matrix.group == 'client'
        run: npm ci --ignore-scripts --prefix clients/private
      - name: Run the shared offline check group
        run: node scripts/check.mjs --group=${{ matrix.group }}

  web-channel-qualification:
    name: Offline browser channel qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch isolated locked dependencies
        run: cargo fetch --manifest-path tools/web-channel/Cargo.toml --locked
      - name: Prepare independent native verifier and pinned browser verifier tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
          cargo fetch --locked
          npm ci --ignore-scripts --prefix tools/web-channel
      - name: Prepare checksum-verified wasm-bindgen tool
        run: |
          curl -fsSL --retry 2 --max-time 90 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          printf '%s  %s\n' 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e "$RUNNER_TEMP/wasm-bindgen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
      - name: Locked offline native, WASM, Node and Chrome qualification
        env:
          CINDER_WASM_BINDGEN: ${{ runner.temp }}/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          CINDER_TEST_CHROME: /usr/bin/google-chrome
        run: node tools/web-channel/check.mjs
