name: Implementation foundation

on:
  pull_request:
    branches: [product/tee-v1, "tee/**"]
  push:
    branches: [product/tee-v1]

permissions:
  contents: read

jobs:
  documentation-contract:
    name: Offline contracts and test inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Prepare pinned metadata tools
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Cache locked metadata dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-targets: false
      - name: Fetch locked metadata dependencies
        run: cargo fetch --locked
      - name: Contracts, inventory and boundary regressions
        run: node scripts/check.mjs --group=contracts
