name: Implementation foundation

on:
  pull_request:
  push:
    branches: [product/tee-v1]

permissions:
  contents: read

jobs:
  documentation-contract:
    name: Plan and handoff consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/check-implementation-plan.mjs
      - run: node --test scripts/check-implementation-plan.test.mjs
