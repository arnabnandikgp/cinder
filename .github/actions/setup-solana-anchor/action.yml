name: setup-solana-anchor
description: Pin Rust/Node/Solana/Anchor, install yarn deps, copy program keys, make a local wallet
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.89.0
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: yarn
        cache-dependency-path: yarn.lock
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
        cache-targets: false
    - name: Install Solana 3.1.10
      shell: bash
      run: |
        sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
        echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
    - name: Install Anchor CLI 1.0.2
      shell: bash
      run: |
        cargo install --git https://github.com/coral-xyz/anchor --tag v1.0.2 anchor-cli --locked --force
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Yarn
      shell: bash
      run: yarn install --frozen-lockfile
    - name: Toolchain pin
      shell: bash
      run: ./scripts/check-toolchain.sh
    - name: Program keypairs
      shell: bash
      run: |
        mkdir -p target/deploy
        cp keys/*-keypair.json target/deploy/
    - name: Local wallet
      shell: bash
      run: |
        mkdir -p "$HOME/.config/solana"
        solana-keygen new --no-bip39-passphrase --silent -o "$HOME/.config/solana/id.json"
        echo "ANCHOR_WALLET=$HOME/.config/solana/id.json" >> "$GITHUB_ENV"
