[workspace]
members = ["crates/kernel", "crates/ports", "crates/test-support", "crates/journal", "crates/pacifica", "crates/api", "crates/service", "crates/web-channel"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
cinder-kernel = { path = "crates/kernel", version = "=0.1.0" }
cinder-ports = { path = "crates/ports", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[profile.release]
overflow-checks = true
