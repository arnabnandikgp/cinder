[package]
name = "cinder-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# No fixture attester, root, storage key or policy in the default build.
local-fixture = []

[dependencies]
cinder-web-channel = { path = "../web-channel", version = "=0.1.0" }
cinder-kernel.workspace = true
cinder-journal = { path = "../journal", version = "=0.1.0" }
cinder-api = { path = "../api", version = "=0.1.0" }
cinder-pacifica = { path = "../pacifica", version = "=0.1.0" }
openssl = "=0.10.81"
aws-nitro-enclaves-cose = "=0.5.2"
aws-nitro-enclaves-nsm-api = "=0.5.2"
serde_cbor = "=0.11.2"
zeroize = "=1.8.2"
socket2 = { version = "=0.6.5", default-features = false, features = ["all"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
aws-sigv4 = { version = "=1.5.1", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = "=1.3.0"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# WebSocket library trace/debug output includes plaintext frames. Compile it out.
log = { version = "=0.4.34", features = ["max_level_off", "release_max_level_off"] }

[[bin]]
name = "cinder-service-fixture"
path = "src/bin/fixture.rs"
required-features = ["local-fixture"]

[[bin]]
name = "cinder-verify-quote"
path = "src/bin/verify.rs"

[[bin]]
name = "cinder-verify-fixture"
path = "src/bin/verify-fixture.rs"
required-features = ["local-fixture"]

[[bin]]
name = "cinder-relay"
path = "src/bin/relay.rs"

[[bin]]
name = "cinder-nitro-relay"
path = "src/bin/nitro-relay.rs"

[[bin]]
name = "cinder-nitro-egress"
path = "src/bin/nitro-egress.rs"

[[bin]]
name = "cinder-enclave"
path = "src/bin/enclave.rs"

[[bin]]
name = "cinder-cloud-relay"
path = "src/bin/cloud-relay.rs"

[[bin]]
name = "cinder-bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "cinder-prepare-release"
path = "src/bin/prepare.rs"

[lints]
workspace = true
