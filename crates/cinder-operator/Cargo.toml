[package]
name = "cinder-operator"
version = "0.1.0"
description = "Durable recovery journal boundary for the Cinder operator"
edition = "2021"
rust-version = "1.89"

[dependencies]
cinder-adapter = { path = "../cinder-adapter" }
cinder-common = { path = "../cinder-common" }
fs2 = "=0.4.3"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
