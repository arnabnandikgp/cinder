[package]
name = "cinder-operator"
version = "0.1.0"
description = "Durable recovery journal boundary for the Cinder operator"
edition = "2021"
rust-version = "1.89"

[dependencies]
cinder-adapter = { path = "../cinder-adapter" }
cinder-common = { path = "../cinder-common" }
fs2 = "=0.4.3"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "=0.10.9"
anchor-lang = "=1.0.2"
cinder-ledger = { path = "../../programs/cinder_ledger", features = ["no-entrypoint"] }
cinder-vault = { path = "../../programs/cinder_vault", features = ["no-entrypoint"] }
base64 = "=0.22.1"
bincode = "=1.3.3"
borsh = "=1.8.1"
bs58 = "=0.5.1"
phoenix-rise-accounts = { version = "=0.5.6", features = ["serde"] }
phoenix-rise-events = "=0.5.6"
phoenix-rise-ix = "=0.5.6"
phoenix-rise-math = "=0.5.6"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.0"
solana-message = { version = "=3.1.0", features = ["bincode"] }
solana-transaction = { version = "=3.1.0", features = ["bincode", "serde"] }
solana-instruction = "=3.5.1"
solana-pubkey = "=3.0.0"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
magicblock-delegation-program-api = { version = "=3.1.0", default-features = false, features = ["instruction"] }

[dev-dependencies]
tempfile = "=3.27.0"
